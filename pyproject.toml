[project]
name = "dronetrack"
version = "0.1.0"
description = "Detection and multi-object tracking of small targets in drone footage (VisDrone)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics",
    "numpy",
    "opencv-python",
    "imageio",
    "gdown",
    "scipy>=1.17.1",
    "lap>=0.5.12",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
demo = [
    "gradio>=5,<6",
]
dev = [
    "pytest",
    "trackeval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronetrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights or network"]
addopts = "-m 'not slow'"

[tool.uv.sources]
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval" }
