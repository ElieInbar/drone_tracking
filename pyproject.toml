[project]
name = "dronetrack"
version = "0.1.0"
description = "Detection and multi-object tracking of small targets in drone footage (VisDrone)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics",
    "numpy",
    "opencv-python",
    "imageio",
    "gdown",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronetrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights or network"]
addopts = "-m 'not slow'"
